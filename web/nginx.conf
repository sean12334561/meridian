server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. With a variable in proxy_pass nginx looks the name up per request, so a recreated
    # api container is found at its new address, and nginx can start before the api does
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 200 MiB, a little above the API's default Upload__MaxBytes of 200,000,000 bytes, so the API
        # sends the 413 as a proper error. Raise this too if that setting goes above it
        client_max_body_size 200m;

        # Hands the upload straight to the API, which streams it to blob storage
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Client-side routes: a refresh on /imports/{id} must still load the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
