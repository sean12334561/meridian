server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Same as Upload__MaxBytes. The API sends the 413 for anything between this and its own limit
        client_max_body_size 200m;

        # Hands the upload straight to the API, which streams it to blob storage
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Client-side routes: a refresh on /imports/{id} must still load the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
