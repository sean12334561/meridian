x-app-environment: &app-environment
  ConnectionStrings__Default: ${ConnectionStrings__Default}
  Storage__ContainerSasUrl: ${Storage__ContainerSasUrl:-}
  Storage__ConnectionString: ${Storage__ConnectionString:-}
  Storage__Container: ${Storage__Container:-imports}
  APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
  Upload__MaxBytes: ${Upload__MaxBytes:-200000000}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrator:
    image: meridian-api
    build:
      context: .
      dockerfile: src/Meridian.Api/Dockerfile
    command: ["--migrate-and-seed"]
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      Seed__MemberStatesPath: /seed/member_states.csv
    volumes:
      - ./data/member_states.csv:/seed/member_states.csv:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: meridian-api
    restart: unless-stopped
    environment:
      <<: *app-environment
      Worker__Enabled: "false"
    depends_on:
      migrator:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy

  worker:
    image: meridian-api
    restart: unless-stopped
    environment:
      <<: *app-environment
      Worker__Enabled: "true"
      Worker__Concurrency: ${Worker__Concurrency:-2}
      Worker__PollIntervalMs: ${Worker__PollIntervalMs:-2000}
    depends_on:
      migrator:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy

  web:
    image: meridian-web
    build:
      context: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  azurite-data:
